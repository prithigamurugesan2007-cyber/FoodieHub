<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieHub — Discover Great Food</title>
  <meta name="description" content="FoodieHub is a frontend-only Single Page Application for discovering restaurants and food.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login screen is shown before the SPA shell -->
  <div id="auth-screen"></div>

  <!-- SPA shell -->
  <div id="site-shell" class="site-shell hidden">
    <header class="navbar">
      <a href="/" class="brand" data-route aria-label="FoodieHub Home">
        <span class="brand-icon">🍴</span>
        <span>Foodie<span>Hub</span></span>
      </a>

      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="/" data-route data-path="/" class="nav-link">Home</a>
        <a href="/restaurants" data-route data-path="/restaurants" class="nav-link">Restaurants</a>
        <a href="/categories" data-route data-path="/categories" class="nav-link">Categories</a>
        <a href="/favorites" data-route data-path="/favorites" class="nav-link">Favorites <span id="favorite-count" class="nav-count">0</span></a>
        <a href="/about" data-route data-path="/about" class="nav-link">About</a>
      </nav>

      <div class="nav-user">
        <button id="profile-button" class="profile-button" type="button" title="Open profile">
          <span id="user-avatar">U</span>
          <span id="nav-user-name">User</span>
        </button>
        <button id="logout-button" class="logout-button" type="button">Logout</button>
        <button class="hamburger" id="hamburger" type="button" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="app" class="app-container" aria-live="polite"></main>

    <footer class="footer">
      <div><strong>🍴 FoodieHub</strong> · Frontend SPA Project</div>
      <div>HTML · CSS · JavaScript · LocalStorage · History API</div>
    </footer>
  </div>

  <!-- ================= VIEW TEMPLATES ================= -->

  <template id="view-home">
    <section class="home-page">
      <div class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">Discover · Taste · Enjoy</p>
          <h1>Good food.<br><span>Good mood.</span></h1>
          <p class="hero-text">Explore hand-picked restaurants, discover delicious dishes, and save your favorites — all in one smooth experience.</p>
          <div class="hero-actions">
            <a href="/restaurants" data-route class="btn btn-primary">Explore Restaurants <span>→</span></a>
            <a href="/categories" data-route class="btn btn-light">Browse Categories</a>
          </div>
        </div>
        <div class="hero-visual">
          <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=85" alt="Table filled with delicious food">
          </div>
          <div class="floating-rating">⭐ <strong>4.9</strong><small>Food lovers rating</small></div>
        </div>
      </div>

      <div class="section-heading">
        <div>
          <p class="eyebrow">Popular today</p>
          <h2>Restaurants you'll love</h2>
        </div>
        <a href="/restaurants" data-route class="text-link">View all →</a>
      </div>
      <div id="home-restaurants" class="restaurant-grid"></div>

      <div class="section-heading compact">
        <div>
          <p class="eyebrow">Explore</p>
          <h2>What are you craving?</h2>
        </div>
      </div>
      <div id="home-categories" class="category-grid"></div>
    </section>
  </template>

  <template id="view-login">
    <section class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">🍴</div>
        <p class="eyebrow">Welcome to FoodieHub</p>
        <h1>Let's find your next favorite meal.</h1>
        <p class="auth-sub">Frontend demo — your account is stored locally in this browser.</p>

        <form id="login-form" class="auth-form" novalidate>
          <label>
            Your name
            <input type="text" id="login-name" placeholder="Enter your name" minlength="2" required>
          </label>
          <label>
            Email address
            <input type="email" id="login-email" placeholder="you@example.com" required>
          </label>
          <label>
            Password
            <input type="password" id="login-password" placeholder="Minimum 4 characters" minlength="4" required>
          </label>
          <p id="login-error" class="form-status err"></p>
          <button class="btn btn-primary full" type="submit">Enter FoodieHub <span>→</span></button>
        </form>
        <p class="demo-note">No backend or real authentication is used for this sprint project.</p>
      </div>
    </section>
  </template>

  <template id="view-restaurants">
    <section class="page">
      <div class="page-header">
        <div>
          <p class="eyebrow">Find your table</p>
          <h1>Restaurants</h1>
          <p class="lead">Browse local favorites and discover your next meal.</p>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <span>⌕</span>
          <input id="restaurant-search" type="search" placeholder="Search restaurants or cuisine..." aria-label="Search restaurants">
        </div>
        <div id="restaurant-filters" class="filter-row"></div>
      </div>
      <div id="restaurant-list" class="restaurant-grid large"></div>
    </section>
  </template>

  <template id="view-categories">
    <section class="page">
      <p class="eyebrow">Choose a craving</p>
      <h1>Food Categories</h1>
      <p class="lead">Pick a category and we'll show you restaurants that serve it.</p>
      <div id="category-list" class="category-grid large"></div>
      <div id="category-results" class="category-results hidden"></div>
    </section>
  </template>

  <template id="view-favorites">
    <section class="page">
      <div class="page-header">
        <div>
          <p class="eyebrow">Saved for later</p>
          <h1>Your Favorites</h1>
          <p class="lead">Your saved restaurants are kept in LocalStorage.</p>
        </div>
      </div>
      <div id="favorite-list" class="restaurant-grid large"></div>
    </section>
  </template>

  <template id="view-profile">
    <section class="page narrow">
      <p class="eyebrow">Your account</p>
      <h1>Profile</h1>
      <div id="profile-card" class="profile-card"></div>
    </section>
  </template>

  <template id="view-about">
    <section class="page">
      <p class="eyebrow">About the project</p>
      <h1>FoodieHub as a SPA</h1>
      <p class="lead">One HTML shell, dynamic views, client-side routing, smooth transitions and browser storage — built with vanilla HTML, CSS and JavaScript.</p>
      <div class="info-grid">
        <article class="info-card"><span>01</span><h3>Single Page</h3><p>The browser loads one HTML document. JavaScript changes the content inside the main app container.</p></article>
        <article class="info-card"><span>02</span><h3>Client Routing</h3><p>Navigation uses the History API so the URL changes without requesting a new page.</p></article>
        <article class="info-card"><span>03</span><h3>Local State</h3><p>Login state and favorite restaurants are stored locally because this sprint does not require a backend.</p></article>
        <article class="info-card"><span>04</span><h3>Error Handling</h3><p>Unknown routes display a friendly 404 screen instead of leaving the application blank.</p></article>
      </div>
    </section>
  </template>

  <template id="view-restaurant">
    <section class="page">
      <div id="restaurant-detail"></div>
    </section>
  </template>

  <template id="view-404">
    <section class="page not-found">
      <div class="error-icon">🍽️</div>
      <p class="eyebrow">Error 404</p>
      <h1>Page not found</h1>
      <p class="lead">We couldn't find <code id="bad-path"></code>.</p>
      <a href="/" data-route class="btn btn-primary">Back to Home</a>
    </section>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
